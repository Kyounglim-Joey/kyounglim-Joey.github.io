name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so photos added to the Google Drive folder appear automatically
  # (03:17 KST). Delete `schedule:` and the cron line if you don't use the Drive gallery.
  schedule:
    - cron: '17 18 * * *'

# Least privilege: read the repo, publish to Pages, mint the OIDC token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Photos are fetched in their own step so the Google key is only visible to our
      # sync script — not to the site build or any of its dependencies.
      - name: Sync gallery photos (Google Drive, optional)
        run: node scripts/sync-photos.mjs
        env:
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
      - name: Build
        run: npx astro build
        env:
          # Repository "Variables" (Settings → Secrets and variables → Actions → Variables).
          # The Umami website ID is public by design; it is not a secret.
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
